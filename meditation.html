<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>瞑想の時間</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="meditation.css" />
  </head>
  <body>
    <div class="container">
      <div class="breathing-circle"></div>

      <div class="content">
        <h1 class="title">瞑想の時間です</h1>
        <p class="instruction">深呼吸をしましょう</p>

        <div class="timer-container">
          <!-- 呼吸ガイドリング -->
          <div class="breath-guide-ring"></div>
          <div class="breath-guide-ring breath-guide-ring-inner"></div>
          <div class="timer" id="timer">5:00</div>
          <p class="timer-label">残り時間</p>
        </div>

        <!-- 統計情報（完了時に表示） -->
        <div class="stats-container" id="statsContainer">
          <p class="stats-streak" id="statsStreak"></p>
          <p class="stats-total" id="statsTotal"></p>
        </div>

        <button class="end-button" id="endButton">瞑想を終了</button>
      </div>
    </div>

    <script src="meditation.js"></script>
  </body>
</html>
