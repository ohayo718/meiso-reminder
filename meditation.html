<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>瞑想の時間</title>
    <link rel="stylesheet" href="meditation.css" />
  </head>
  <body>
    <div class="container">
      <div class="breathing-circle"></div>

      <div class="content">
        <h1 class="title">瞑想の時間です</h1>
        <p class="instruction">目を閉じて、深呼吸をしましょう</p>
        <p class="sub-instruction">息を吸って... ゆっくり吐いて...</p>

        <div class="timer-container">
          <div class="timer" id="timer">5:00</div>
          <p class="timer-label">残り時間</p>
        </div>

        <button class="end-button" id="endButton">瞑想を終了</button>
      </div>
    </div>

    <script src="meditation.js"></script>
  </body>
</html>
